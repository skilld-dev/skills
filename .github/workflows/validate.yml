name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y skills-ref@0.1.5 validate skills/find-skill
      - run: npx -y skills-ref@0.1.5 validate skills/publish-skill
